version: '3.8'

services:
  server-registry:
#    image: eureka-server:latest
    build: ./Day27-Docker-ServerRegistry
    image: server-registry:latest
    container_name: server-registry
    ports:
      - "8761:8761"
    networks:
      - mysql_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/"]
      interval: 30s
      timeout: 10s
      retries: 5


