  config-server:
    build: ./Day27-Docker-ConfigServer
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - server-registry
    networks:
      - mysql_network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server-registry:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 30s

  api-gateway:
    build: ./Day27-Docker-APIGateaway
    container_name: api-gateway
    ports:
      - "9090:9090"
    networks:
      - mysql_network
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
    depends_on:
      config-server:
        condition: service_healthy

  server-customer:
    build: ./Day27-Docker-WebClientCustomer
    container_name: server-customer
    ports:
      - "6060:6060"
    depends_on:
      - api-gateway
 #     - mysql-container-customers_db
    networks:
      - mysql_network
    environment:
      - SPRING_APPLICATION_NAME=server-customer
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-container-customers_db:3306/customers_db
#      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver

  server-bank:
    build: ./Day27-Docker-WebClientBank
    container_name: server-bank
    ports:
      - "6061:6061"
    depends_on:
      - api-gateway
#      - mysql-container-banks_db
    networks:
      - mysql_network
    environment:
      - SPRING_APPLICATION_NAME=server-bank
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-container-banks_db:3306/banks_db
#      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver

  server-vendor:
    build: ./Day27-Docker-WebClientVendor
    container_name: server-vendor
    ports:
      - "6062:6062"
    depends_on:
      - api-gateway
#      - mysql-container-vendors_db
    networks:
      - mysql_network
    environment:
      - SPRING_APPLICATION_NAME=server-vendor
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-container-vendors_db:3306/vendors_db
#      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver

networks:
  mysql_network:
    driver: bridge