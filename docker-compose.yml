  config-server:
    build: ./Day27-Docker-ConfigServer
    image: config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
        server-registry:
            condition: service_healthy
    networks:
      - mysql_network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://server-registry:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 30s

  api-gateway:
    build: ./Day27-Docker-APIGateaway
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "9090:9090"
    networks:
      - mysql_network
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
    depends_on:
      config-server:
        condition: service_healthy
      server-registry:
        condition: service_healthy

  server-customer:
    build: ./Day27-Docker-WebClientCustomer
    image: server-customer:latest
    container_name: server-customer
    ports:
      - "6060:6060"
