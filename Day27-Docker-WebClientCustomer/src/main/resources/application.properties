spring.application.name=SERVER-CUSTOMER
spring.config.import=optional:configserver:http://localhost:8888/

server.port=6060

management.endpoints.web.exposure.include=*

eureka.client.service-url.defaultZone: http://server-registry:8761/eureka/
server.servlet.context-path= /server-registry

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql-container-customers_db}:${MYSQL_PORT:3308}/${MYSQL_DB_NAME:customers_db}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Cloud Config Server URI
spring.cloud.config.uri=http://config-server:8888
