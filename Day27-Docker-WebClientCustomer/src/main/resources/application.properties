spring.application.name=SERVER-CUSTOMER
spring.config.import=optional:configserver:http://localhost:8888/

server.port=6060

management.endpoints.web.exposure.include=*

spring.datasource.url=jdbc:mysql://mysql-container-customers_db:3306/customers_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Spring Cloud Config Server URI
spring.cloud.config.uri=http://configserver:8888

#logging.level.org.springframework=DEBUG

# Enable tracing
management.tracing.sampling.probability=1.0

# Set the Zipkin endpoint (default is http://localhost:9411)
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

spring.main.allow-bean-definition-overriding=true

spring.boot.message=From application.properties
