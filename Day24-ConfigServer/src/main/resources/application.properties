spring.application.name=Config-Server

server.port=8888

# Use local file system for configuration storage
spring.profiles.active=native
spring.cloud.config.server.git.uri=https://github.com/Sahil-Naik/JAVA-J2EE/tree/main/Day24-ConfigServer
spring.cloud.config.server.git.skipSslValidation=true
spring.cloud.config.server.git.clone-on-start=true

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/wipro
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

management.endpoints.web.exposure.include=*