spring.r2dbc.url=r2dbc:mysql://localhost:3306/wipro
spring.r2dbc.username=root
spring.r2dbc.password=root
spring.r2dbc.pool.enabled=true

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

server.port=8081
spring.application.name=server-bank

eureka.instance.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include: refresh, busrefresh

spring.boot.message=Hello this is from Bank! Updated 2

spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

management.endpoint.circuitbreakers.enabled=true
management.endpoints.enabled-by-default=true

resilience4j.circuitbreaker.metrics.enabled=true

resilience4j.circuitbreaker.instances.bankService.sliding-window-size=10
resilience4j.circuitbreaker.instances.bankService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bankService.wait-duration-in-open-state=5000ms
resilience4j.circuitbreaker.instances.bankService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bankService.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.bankService.slow-call-rate-threshold=50
