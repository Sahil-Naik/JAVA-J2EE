spring.application.name=server-bank
spring.profiles.active=r2dbc

spring.r2dbc.url=r2dbc:mysql://mysql-container-banks_db:3306/banks_db
spring.r2dbc.username=root
spring.r2dbc.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.cloud.config.uri=http://config-server:8888

spring.config.import=optional:configserver:http://config-server:8888/

server.port=6061

management.endpoints.web.exposure.include=*

eureka.client.service-url.defaultZone: http://server-registry:8761/eureka/

#logging.level.org.springframework=DEBUG
