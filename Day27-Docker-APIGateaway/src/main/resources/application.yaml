spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: server-customer
          uri: lb://SERVER-CUSTOMER
          predicates:
            - Path=/customer/**
        - id: server-bank
          uri: lb://SERVER-BANK
          predicates:
            - Path=/bank/**
        - id: server-vendor
          uri: lb://SERVER-VENDOR
          predicates:
            - Path=/vendor/**
  config:
    import: optional:http://config-server:8888

server:
  port: 9090

eureka:
  client:
    service-url:
      defaultZone: http://server-registry:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
  instance:
    hostname: localhost



